# Cheap, fast repo guards that need no Apple toolchain. They run on
# ubuntu-latest (1x billing). Building and testing the app is Xcode Cloud's job
# (docs/ci.md).

name: Guards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  service-language-guard:
    name: Service-language guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      # PlowR serves snow removal, lawn care and landscaping from the same
      # screens (since 1.1.0, which replaced snow-only icons and wording on
      # them). This fails the build if snow-specific copy or a fixed snowflake
      # icon reappears on a screen every industry shares.
      #
      # Only the shared screens are checked. Snow-specific places are fine:
      # the service catalog ("Snow Plowing"), weather, and icons chosen from a
      # service's own category. Put new snow-only features in their own files.
      #
      # An icon is caught wherever its name appears ("snowflake",
      # "thermometer.snowflake", "cloud.snow", "wind.snow" and the like), so
      # one returned from a function counts too; the word "snow" on its own is
      # weather code. A listed path that's gone fails the job: grep used to
      # exit 2 for it and the job passed, checking nothing. Client mode
      # (Views/ClientMode) isn't checked: there a client picks the service
      # they want, snow removal included.
      - name: Service-language guard
        run: |
          SHARED="PlowR/Views/DashboardView.swift PlowR/Views/MainTabView.swift PlowR/Views/ActiveRoute PlowR/Views/Routes PlowR/Activity PlowR/Intents PlowRWidgets PlowR/Views/Schedule PlowR/Views/Clients PlowR/Views/Proposals PlowR/Views/SettingsView.swift PlowR/Views/Settings PlowR/Views/ServiceLog"
          ICON='"([a-z.]*snowflake[a-z.]*|[a-z]+(\.[a-z]+)*\.snow(\.[a-z]+)*)"'
          COPY='"(Start|Begin|End|Finish|Next|Resume|Complete) (Plow|Snow)|"Plow(ing|ed)? (Route|Stop|Job|Complete|History|Day|Done)|"Snow (Route|Stop|Job|Day|Done)|"(Plowed|Plowing)[" !.]|"(Snow Plowing|Salting / Ice Melt|Walkway Shoveling|Roof Snow Removal|Snow Removal|Plow)"'
          found=0
          for path in $SHARED; do
            if [ ! -e "$path" ]; then
              echo "::error::$path is listed in the guard but doesn't exist. Update SHARED in guards.yml."
              found=1
            fi
          done
          # GitHub runs this with bash -e: grep's "no match" (1) must not end
          # the step, so its status is caught rather than left to fail.
          check() {
            status=0
            grep -rnE "$1" $SHARED --include='*.swift' --exclude=ServiceCatalogView.swift || status=$?
            case $status in
              0) echo "::error::$2"; found=1 ;;
              1) ;;
              *) echo "::error::The guard's grep failed, so nothing was checked."; found=1 ;;
            esac
          }
          check "$ICON" "Fixed snowflake icon on a shared screen. Choose the icon from the service's category instead."
          check "$COPY" "Snow-specific wording on a shared screen. Use industry-neutral copy (stop, route, service)."
          [ "$found" -eq 0 ] && echo "Service-language guard passed."
          exit "$found"

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SwiftLint needs a Swift toolchain but not Xcode, so it runs on the 1x
    # Linux runner. Pinned to the version on Joe's Mac (`swiftlint version`)
    # so scripts/lint.sh and this job judge the same rules; bump both together.
    container: ghcr.io/realm/swiftlint:0.65.1

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      # A real gate since 2026-09-27: any error-severity violation (force
      # unwrap, force cast, try!) fails the job, and "SwiftLint" is a required
      # check on main. It was report-only until the 35 existing force-unwraps
      # were removed (#17). Warnings don't fail it. GitHub shows at most 10
      # annotations per step; the log's "Found N violations, M serious" line
      # has the full count.
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging
