# Full test run for every pull request, on GitHub's own macOS runner.
#
# Why (2026-10-10): Xcode Cloud's compute hours (shared by every app on the
# developer membership) ran out mid-month, and every PR's `CI Tests` run was
# cancelled before it started, so nothing could merge until the period
# resets. The repository is public, so GitHub-hosted runners are free, macOS
# included. Xcode Cloud keeps Release Flow (TestFlight and App Store builds).
# This job reports alongside `CI Tests` first; it replaces it as the required
# check only once its run time is known (docs/ci.md).
#
# What runs: the PlowR scheme's tests through the shared toolkit's
# bin/test.sh at one pinned toolkit commit, so CI and a local scripts/test.sh
# judge a run by the same signals: xcodebuild's exit code, the literal
# ** TEST SUCCEEDED **, and a non-zero count in the result bundle. The local
# wrapper's StoreKit tests aren't run (Apple's local test store isn't
# reliable on CI), as on Xcode Cloud.

name: Tests

on:
  pull_request:
    branches: [main]
    # ready_for_review is here so marking a draft ready starts the run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Which runs spend macOS time (docs/ci.md): a push to main always does. A pull
# request does once it is ready for review (not a draft) and changes more than
# docs. The `Unit tests (iOS)` check is required, so the workflow itself must
# always start: a workflow-level paths filter would leave that check pending
# forever. The decision is made by a cheap Linux job; a skipped required job
# counts as passing.

# Read the code, nothing more.
permissions:
  contents: read

# A newer push to the same PR cancels the run in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Drafts skip the macOS run; ready_for_review starts it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      macos: ${{ steps.classify.outputs.macos }}
    steps:
      # Two commits are enough: on a pull_request run HEAD is the merge of the
      # PR into main, and its first parent is main.
      - name: Check out repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2

      # Docs-only means every changed file is under docs/ or changelog.d/, or
      # is a Markdown file. Anything else (Swift, the Xcode project, tests,
      # assets, scripts, workflows) needs the tests. Push to main always runs.
      - name: Decide whether macOS tests are needed
        id: classify
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: running the tests."
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "$files"
          if [ -z "$files" ]; then
            other=""
          else
            other=$(echo "$files" | grep -Ev '^(docs/|changelog\.d/)|\.md$' || true)
          fi
          if [ -n "$other" ] || [ -z "$files" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "Code or config changed: running the tests."
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
            echo "Docs only: skipping the macOS tests."
          fi

  unit:
    name: Unit tests (iOS)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Pinned to a commit, not main, so a toolkit change is a deliberate bump.
      - name: Check out the shared toolkit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: FreeScoopDev/app-toolkit
          ref: 452ea4bcf8597dac4121dc66cccb60f2a9f6d7e7
          path: toolkit

      # The newest Xcode 26 on the image: Xcode Cloud builds this project
      # with Xcode 26 (iOS 26.5 SDK) too.
      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # A hung test used to run into the job's 45 minutes (#190's first run,
      # 2026-10-18): GitHub cancelled the job and nothing said which test
      # hung. Each test may now take 2 minutes (xcodebuild's time allowance,
      # which Swift Testing honours: a probe test that slept 10 minutes failed
      # at its limit with "Time limit was exceeded" and the run went on).
      - name: Run the tests (PlowRTests)
        env:
          TEST_OUTPUT_DIR: ${{ runner.temp }}/plowr-tests
          TEST_XCODEBUILD_ARGS: >-
            -test-timeouts-enabled YES
            -default-test-execution-time-allowance 120
            -maximum-test-execution-time-allowance 120
        run: bash toolkit/bin/test.sh "$GITHUB_WORKSPACE"

      # Cancelled too: a run that hits the job's time limit keeps its log.
      - name: Upload the log and result bundle on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-results
          path: ${{ runner.temp }}/plowr-tests
          retention-days: 7
